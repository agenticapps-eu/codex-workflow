name: openspec-gate

# The agent-agnostic enforcement floor for the §18 OpenSpec change-gate.
#
# The per-agent PreToolUse hook (.codex/hooks.json) gives fast feedback but is
# loaded at session start and cannot gate the session that installed it. The git
# pre-commit hook catches humans but can be waved through with --no-verify. This
# job is the surface no local configuration can bypass.
#
# It runs in two steps, and the order is the point:
#
#   1. Score the vendored gate with core's conformance harness.
#   2. Only then run the gate.
#
# A drifted gate passes every repo it guards while enforcing nothing — issue #32
# found five divergent copies on one machine, none conformant, all reporting
# clean. Step 1 is what makes step 2's verdict mean something.
#
# The gate is the REPO-LOCAL vendored copy, never the shared
# ~/.agenticapps/bin/ one. A runner has no shared path, and enforcing with a
# copy this job never scored would defeat step 1.
#
# --ci is whole-repo: an unreviewed active change fails the build even if this
# pull request did not touch it. A proposal-only PR is therefore red until its
# REVIEWS.md lands, which is the rule working — reviews come before code.
#
# It no-ops on a repo with no openspec/changes/ (see bin/openspec-gate-ci.sh),
# so it is safe to enable before the spec slot is initialised.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # This host's identity, so codex's own reviews do not count toward the
  # >= 2 independent reviewer threshold. Set on every surface this repo ships;
  # a gate that counts self-review disagrees with the §02 evidence verifier.
  OPENSPEC_GATE_SELF: codex

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install the OpenSpec CLI
        run: npm i -g @fission-ai/openspec

      - name: Prove the gate itself is conformant
        # Every declared row must pass. The bar is zero failures, not a fixed
        # count: the harness grows as core adds rows, and a hardcoded number
        # would read like verification while verifying less than the instrument
        # offers.
        #
        # `env -u OPENSPEC_GATE_SELF` is REQUIRED, not tidiness. Workflow-level
        # env is inherited by every run: step, and one harness row seeds its
        # fixture with reviewers `claude` and `codex`. With codex ambient the
        # gate correctly excludes that review, the row sees one reviewer and
        # blocks, and a perfectly conformant gate scores 27/28 — turning every
        # PR red for a reason that lives entirely in the measurement. The
        # predictable response to permanently-red CI is to disable the workflow,
        # which is the trained-`--no-verify` failure this whole floor exists to
        # avoid.
        #
        # `OPENSPEC_GATE_SELF: ""` via step env would NOT do: it leaves the
        # variable set-but-empty, which a `set -u` consumer without `:-` treats
        # differently from unset. `env -u` is unambiguous.
        run: env -u OPENSPEC_GATE_SELF bash tools/change-gate-conformance.sh bin/openspec-change-gate.sh

      - name: Prove the review producer's wrapper is conformant
        # The gate CONSUMES review evidence; bin/reviewer-cli.sh PRODUCES it.
        # This step is before the gate for the same reason the gate's own
        # conformance step is: a drifted CONSUMER fails loudly, while a drifted
        # PRODUCER reports clean and quietly supplies less of the evidence the
        # consumer then accepts. Core#41 is what that looks like — a wrapper
        # that lost its `opencode` arm, a review recorded as "reviewer
        # unavailable", and a change that proceeded with one fewer opinion.
        #
        # No `env -u OPENSPEC_GATE_SELF` here, unlike the gate's step: the
        # wrapper never reads that variable, so unsetting it would be cargo cult.
        # The harness stubs every vendor CLI on PATH in a mktemp dir — no real
        # reviewer is invoked and nothing leaves the runner.
        run: bash tools/reviewer-cli-conformance.sh bin/reviewer-cli.sh

      - name: Run the change gate over every active change
        # The driver re-checks conformance itself, so that non-CI callers get
        # the same guarantee. The duplication is deliberate and costs about a
        # second: this step exists so the ordering is visible in the CI log
        # rather than buried inside a script.
        run: bash bin/openspec-gate-ci.sh
